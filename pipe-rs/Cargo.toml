[package]
name = "hikkari-pipe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Prototype of the cascade entry's pipe in Rust (bench only, not deployed)"

[dependencies]
libc = "=0.2.184"
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes"] }
hkdf = "=0.12.4"
sha2 = "=0.10.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
